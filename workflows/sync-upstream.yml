name: Sync Fork with Odoo Upstream

on:
  schedule:
    - cron: '0 3 * * *'  # Runs every day at 3 AM UTC
  workflow_dispatch:      # Also allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global user.email "informatic.eng.0011@gmail.com"
          git config --global user.name "informaticeng0011"

      - name: Add Odoo upstream and fetch changes
        run: |
          git remote add upstream https://github.com/odoo/odoo.git
          git fetch upstream

      - name: Merge upstream/main into your main
        run: |
          git checkout main
          git merge upstream/main -m "Sync with upstream Odoo repo"

      - name: Push changes to your fork
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
