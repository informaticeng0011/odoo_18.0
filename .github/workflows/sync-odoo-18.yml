name: Sync Fork with Odoo Upstream (18.0 Branch)

on:
  schedule:
    - cron: '0 3 * * *'  # Runs daily at 3:00 AM UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout default branch of the fork
      uses: actions/checkout@v4
      with:
        persist-credentials: false  # We'll manually use a token later

    - name: Fetch and checkout 18.0
      run: |
        git fetch origin 18.0
        git checkout 18.0

    - name: Set up Git config
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add upstream Odoo repo
      run: |
        git remote add upstream https://github.com/odoo/odoo.git
        git fetch upstream 18.0

    - name: Merge upstream/18.0 into your 18.0
      run: |
        git merge upstream/18.0 --allow-unrelated-histories || true

    - name: Push to your fork (force update)
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git push --force https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git 18.0
