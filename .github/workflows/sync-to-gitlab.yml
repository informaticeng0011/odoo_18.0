name: Sync GitHub to GitLab (18.0 Branch)

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4:00 AM UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Fetch and checkout 18.0 branch
      run: |
        git fetch origin 18.0
        git checkout 18.0

    - name: Set up Git config
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add GitLab remote and push
      env:
        GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO }}
      run: |
        git remote add gitlab "${GITLAB_REPO}"
        git push --force gitlab 18.0
